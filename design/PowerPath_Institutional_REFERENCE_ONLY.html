<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PowerPath Underwriting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one project record as the spine. Thin top bar (3 destinations), portfolio register table,
   record = sticky status header + 6 tabs. Left-aligned, ledger-like rows, colour reserved for state. */
:root{
  color-scheme: light;
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#f7f8f8; --sunk:#e9edeb;
  --ink:#16201c; --ink-2:#47534e; --muted:#67736e; --rule:#d6dcd9; --rule-strong:#b9c2be;
  --accent:#1d5a96; --accent-ink:#ffffff; --accent-soft:#e2ebf5; --focus:#1d5a96;
  --ok:#25703f; --ok-soft:#e1f0e6; --warn:#875400; --warn-soft:#faefd8;
  --bad:#a52e25; --bad-soft:#f8e3e0; --ns:#56625d; --ns-soft:#eceeed;
  --ev-exec:#0a5a94; --ev-exec-ink:#ffffff;
  --ev-pub:#0f6f86; --ev-pub-soft:#e0f1f5;
  --ev-mgmt:#8a5300; --ev-mgmt-soft:#fbf1df;
  --ev-asm:#8e3670; --ev-asm-soft:#f6e6f0;
  --ev-unk:#55605c; --ev-unk-soft:#eef0ef;
  --s1:#2a6cc0; --s2:#d0601f; --grid:#e3e7e5; --breach:#a52e25;
  --f-display:"Archivo","Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r-s:4px; --r-m:8px;
  --shadow:0 1px 2px rgba(22,32,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121715; --surface:#1a201e; --surface-2:#1f2623; --sunk:#252d2a;
    --ink:#e7ecea; --ink-2:#b7c1bd; --muted:#909b97; --rule:#303a36; --rule-strong:#46524d;
    --accent:#7fb0e6; --accent-ink:#0f1a26; --accent-soft:#1f3044; --focus:#9cc4ef;
    --ok:#7cc994; --ok-soft:#1c3324; --warn:#e5b45a; --warn-soft:#3a2d14;
    --bad:#f08a80; --bad-soft:#3d1f1c; --ns:#a7b1ad; --ns-soft:#262e2b;
    --ev-exec:#5aa3e0; --ev-exec-ink:#0c1620;
    --ev-pub:#5cc0d6; --ev-pub-soft:#16323a;
    --ev-mgmt:#e8ae55; --ev-mgmt-soft:#36290f;
    --ev-asm:#e28cc5; --ev-asm-soft:#3a1d30;
    --ev-unk:#aab4b0; --ev-unk-soft:#262e2b;
    --s1:#3d86e0; --s2:#d96a2a; --grid:#29322f; --breach:#f08a80;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#121715; --surface:#1a201e; --surface-2:#1f2623; --sunk:#252d2a;
    --ink:#e7ecea; --ink-2:#b7c1bd; --muted:#909b97; --rule:#303a36; --rule-strong:#46524d;
    --accent:#7fb0e6; --accent-ink:#0f1a26; --accent-soft:#1f3044; --focus:#9cc4ef;
    --ok:#7cc994; --ok-soft:#1c3324; --warn:#e5b45a; --warn-soft:#3a2d14;
    --bad:#f08a80; --bad-soft:#3d1f1c; --ns:#a7b1ad; --ns-soft:#262e2b;
    --ev-exec:#5aa3e0; --ev-exec-ink:#0c1620;
    --ev-pub:#5cc0d6; --ev-pub-soft:#16323a;
    --ev-mgmt:#e8ae55; --ev-mgmt-soft:#36290f;
    --ev-asm:#e28cc5; --ev-asm-soft:#3a1d30;
    --ev-unk:#aab4b0; --ev-unk-soft:#262e2b;
    --s1:#3d86e0; --s2:#d96a2a; --grid:#29322f; --breach:#f08a80;
    --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{font-family:var(--f-display);font-stretch:87%;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:1.75rem;line-height:1.15;font-weight:650}
h2{font-size:1.15rem;line-height:1.25;font-weight:650}
h3{font-size:.95rem;line-height:1.3;font-weight:650}
p{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.prose{max-width:68ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font:650 1.05rem/1 var(--f-display);font-stretch:85%}
.brand svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 10px;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.top .spacer{flex:1}
.btn{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-s);padding:6px 11px;cursor:pointer;min-height:32px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font:600 12px/1.3 var(--f-body);border:1px solid transparent;white-space:nowrap;max-width:100%}
.chip .g{font-size:11px;line-height:1}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.ns{background:var(--ns-soft);color:var(--ns);border-color:var(--rule-strong)}
.chip.line{background:transparent;color:var(--ink-2);border:1px dashed var(--rule-strong)}
.chip.wrapok{white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* evidence label badges: colour + glyph + border style + text */
.ev{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:1px 7px;font:600 11.5px/1.5 var(--f-body);white-space:nowrap;border:1px solid}
.ev i{font-style:normal;font-size:10px;line-height:1}
.ev-exec{background:var(--ev-exec);color:var(--ev-exec-ink);border-color:var(--ev-exec)}
.ev-pub{background:var(--ev-pub-soft);color:var(--ev-pub);border-color:var(--ev-pub)}
.ev-mgmt{background:var(--ev-mgmt-soft);color:var(--ev-mgmt);border-style:dashed;border-color:var(--ev-mgmt)}
.ev-asm{color:var(--ev-asm);border-color:var(--ev-asm);border-style:dotted;background:repeating-linear-gradient(135deg,var(--ev-asm-soft) 0 4px,transparent 4px 7px)}
.ev-unk{background:var(--ev-unk-soft);color:var(--ev-unk);border-color:var(--ev-unk);border-style:dotted}
.ref{font-size:11.5px;color:var(--muted);white-space:nowrap}
.lrow .ref{white-space:normal}
a.url{word-break:break-all}

/* page */
main{padding-block:24px 40px}
.pagehead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{color:var(--ink-2);margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--rule)}
.panel-b{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2,.split{grid-template-columns:minmax(0,1fr)}}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-m)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
th{font:600 12px/1.35 var(--f-body);color:var(--muted);background:var(--surface-2);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.port td{min-width:120px}
.port td.name{min-width:170px}
.port td.blk{min-width:220px;max-width:320px}
.port .nm{font-weight:600;color:var(--ink);text-decoration:none}
.port .nm:hover{text-decoration:underline}
.cap{max-width:260px}
.gates{display:inline-flex;gap:3px}
.gates.gh span{border:0;height:auto;font-weight:600;color:var(--muted);background:none}
.gates span{width:22px;height:22px;border-radius:3px;display:inline-grid;place-items:center;font:700 10px/1 var(--f-body);border:1px solid}
.g-pass{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)!important}
.g-cond{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)!important}
.g-fail{background:var(--bad);color:var(--surface);border-color:var(--bad)!important}
.g-ns{background:var(--ns-soft);color:var(--ns);border-color:var(--rule-strong)!important;border-style:dashed!important}

.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.toolbar label{display:inline-flex;align-items:center;gap:8px;font-weight:500}
select,input[type=number],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-s);padding:6px 8px;min-height:34px;max-width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

.matrix{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.matrix>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.matrix .gid{font:650 13px/1.2 var(--f-display);font-stretch:85%}
.matrix .gn{font-size:12.5px;color:var(--ink-2);min-height:2.6em}
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:2px;background:var(--surface)}
.bar span{display:block;height:100%}
.bar .p{background:var(--ok)}.bar .c{background:var(--warn)}.bar .f{background:var(--bad)}.bar .n{background:var(--rule-strong)}
.counts{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (max-width:700px){
  .port thead{display:none}
  .port,.port tbody,.port tr,.port td{display:block;width:100%}
  .port tr{padding:12px 14px;border-bottom:1px solid var(--rule)}
  .port td{border:0;padding:4px 0;min-width:0!important;max-width:none!important;text-align:left}
  .port td::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .port td.name::before{display:none}
  .port td.name .nm{font-size:1.05rem}
}
/* record */
.rec-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.rec-head .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2)}
.rec-title{display:flex;gap:12px 20px;align-items:baseline;flex-wrap:wrap}
.rec-title .meta{color:var(--ink-2);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:2px}
.tabs a{padding:9px 12px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11px;color:var(--muted);margin-left:4px}

dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;margin:0}
dl.kv>div{display:contents}
dl.kv dt,dl.kv dd{padding:8px 0;border-bottom:1px solid var(--rule);margin:0}
dl.kv dt{color:var(--ink-2);padding-right:12px}
dl.kv dd{text-align:right;font-weight:600;white-space:nowrap}
dl.kv>div:last-child dt,dl.kv>div:last-child dd{border-bottom:0}

.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.list>li:last-child{border-bottom:0}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.gate{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:4px 14px;padding:14px 16px;border-bottom:1px solid var(--rule);align-items:start}
.gate:last-child{border-bottom:0}
.gate .gid{font:650 1rem/1.2 var(--f-display);font-stretch:85%;color:var(--ink-2);padding-top:2px}
.gate .why{color:var(--ink-2);font-size:13px}
.gate .close{font-size:13px}
.gate .close b{font-weight:600}
@media (max-width:600px){.gate{grid-template-columns:40px minmax(0,1fr)}.gate .chip{grid-column:2;justify-self:start}}

/* screening scenario */
.screen{border:1px solid var(--rule-strong);border-radius:var(--r-m);background:var(--surface)}
.screen-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px)}
.screen-h .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.warns{padding:12px 16px 14px;border-bottom:1px solid var(--rule);background:var(--bad-soft)}
.warns h3{color:var(--bad);display:flex;gap:6px;align-items:center}
.warns ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.warns li{color:var(--ink);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule)}
.metrics>div{background:var(--surface);padding:12px 16px;min-width:0}
.metrics .k{font-size:12px;color:var(--muted)}
.metrics .v{font:600 1.3rem/1.25 var(--f-display);font-stretch:90%;color:var(--ink)}
.metrics .s{font-size:11.5px;color:var(--muted)}
.metrics .s.vl{color:var(--bad);font-weight:600}
@media (max-width:700px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}

.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--rule)}
.field:last-child{border-bottom:0}
.field label{font-weight:600}
.field .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input,.field select{width:100%}
.field .unit{font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.conflict{font-size:12.5px;color:var(--bad);background:var(--bad-soft);border-radius:var(--r-s);padding:6px 8px}
.edited-dot{color:var(--accent);font-weight:700}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--rule-strong);stroke-width:1}
.chart .l1{stroke:var(--s1);stroke-width:2;fill:none}
.chart .l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:6 4}
.chart .ref{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 3}
.chart .bm{fill:var(--breach)}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.chart .dot1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.chart .dot2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.chart .ar1{fill:color-mix(in srgb,var(--s1) 10%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.sw.s1{border-color:var(--s1)}.sw.s2{border-color:var(--s2);border-top-style:dashed}.sw.bm{border-top:6px solid var(--breach);width:4px}.sw.ref{border-color:var(--ink-2);border-top-style:dotted}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-s);padding:6px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);min-width:150px;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip div{display:flex;justify-content:space-between;gap:12px}

.empty{border:1px dashed var(--rule-strong);border-radius:var(--r-m);padding:20px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.err{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r-m);padding:12px 14px}
details>summary{cursor:pointer;font-weight:600;padding:12px 16px}
details[open]>summary{border-bottom:1px solid var(--rule)}

.foot{border-top:1px solid var(--rule);background:var(--surface)}
.foot .wrap{display:flex;gap:8px 18px;flex-wrap:wrap;padding-block:10px;font-size:12.5px;color:var(--ink-2);align-items:center}
.foot strong{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.tabs a,.btn,.nav a{transition:background .12s,color .12s,border-color .12s}}
@media (max-width:600px){.rec-head .crumbs,.rec-head .meta{display:none}.rec-head .chip{font-size:11px;padding:2px 8px 2px 6px}h1{font-size:1.4rem}.panel-b{padding:14px}.metrics .v{font-size:1.1rem}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#portfolio" aria-label="PowerPath home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M5 15h4l2-8 2 8h4" stroke="var(--accent-ink)" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
      PowerPath
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#portfolio" data-nav="portfolio">Portfolio</a>
      <a href="#evidence" data-nav="evidence">Evidence library</a>
      <a href="#method" data-nav="method">Method and limits</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn" id="theme-toggle" type="button" aria-label="Colour theme">Theme: system</button>
  </div>
</header>
<div id="app"></div>
<footer class="foot" role="contentinfo">
  <div class="wrap" id="foot"></div>
</footer>

<script>
/* @powerpath/engine 25.9.0-risk1 — browser build */
(function(root){'use strict';
const __ppModules={};
const __ppRequire=(p)=>{if(Object.prototype.hasOwnProperty.call(__ppModules,p))return __ppModules[p];throw Error('Module not bundled: '+p);};
__ppModules['./facilities.cjs']=(function(require){const module={exports:{}};const exports=module.exports;
/**
 * PowerPath v25.9 debt facilities (fixed-rate notes) per FACILITY_SPEC_v259.md. Pure helpers used by
 * evaluate() in underwrite.cjs. No transaction terms are hard-coded here: every term is an input.
 * Units: $M, months (model month 1 = calendarStartYear/calendarStartMonth), % as 0-100.
 */
'use strict';

const EVIDENCE_LABELS = ['Executed', 'Public approximate', 'Management expectation', 'Assumption', 'Unknown'];
const AMORT_TYPES = ['none', 'unknown', 'pctOriginalPerYear', 'explicit'];
const AMORT_START_TYPES = ['fixedMonth', 'afterFirstRent', 'afterFinalCommencement'];

function gateStrip(gs){ return `<span class="gates" role="img" aria-label="${esc(gs.map(g => g.id+' '+g.status).join(', '))}">` + gs.map(g => `<span class="${stOf(g.status).box}" title="${esc(g.id+' '+g.name+': '+g.status)}">${stOf(g.status).g}</span>`).join('') + '</span>'; }
function gateChip(st){ return `<span class="chip ${stOf(st).cls}"><span class="g" aria-hidden="true">${stOf(st).g}</span>${esc(st)}</span>`; }

/* ---------- editable inputs ---------- */
const INPUTS = [
  {k:'constructionCostMW', label:'Construction capex', unit:'$M per MW', step:0.1, min:0},
  {k:'powerResponsibility', label:'Power cost paid by', type:'select'},
  {k:'rentPerKwMonth', label:'Starting rent', unit:'$ per kW-month', step:1, min:0},
  {k:'delayMonths', label:'Power and lease delay', unit:'months', step:1, min:0},
  {k:'powerCostMWh', label:'Power price', unit:'$ per MWh', step:1, min:0},
  {k:'pue', label:'PUE', unit:'facility power / IT power', step:0.01, min:1},
];
function inputProvenance(c, k, val, edited){
  if (k === 'powerResponsibility' && c.power && c.power.values.includes(val)) return badge(c.power.label) + ` <span class="ref">${esc(c.power.ref)}</span>`;
  return badge('Assumption') + ` <span class="ref">${edited ? 'edited here' : 'frozen input'}</span>`;
}

/* ---------- router ---------- */
const TABS = [['summary','Summary'],['power','Power'],['finance','Finance'],['debt','Debt facilities'],['evidence','Evidence'],['decisions','Decisions']];
function parse(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.startsWith('case.')){ const [, key, tab] = h.split('.'); if (byKey[key]) return {view:'case', key, tab: TABS.some(t => t[0] === tab) ? tab : 'summary'}; }
  if (h === 'evidence' || h === 'method') return {view:h};
  return {view:'portfolio'};
}
function route(){
  const r = parse();
  document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === (r.view === 'case' ? 'portfolio' : r.view)));
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.hasAttribute('aria-current')) a.setAttribute('aria-current','page'); });
  if (r.view === 'case') renderCase(byKey[r.key], r.tab);
  else if (r.view === 'evidence') renderEvidenceLib();
  else if (r.view === 'method') renderMethod();
  else renderPortfolio();
  document.title = (r.view === 'case' ? byKey[r.key].name + ' – ' : '') + 'PowerPath Underwriting';
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); const h = document.querySelector('main h1'); if (h) h.focus({preventScroll:true}); });

/* ---------- portfolio ---------- */

      <span class="counts">${order.filter(k => t[k]).map(k => `<span>${t[k]} ${k.toLowerCase()}</span>`).join('')}</span></div>`; }).join('')}</div>
    <p class="small muted chips" style="margin-top:-6px">Stage gates G0–G5 come from the engine’s assurance module (Risk policy). Evidence checks E1–E3 are register comparisons, not gates. Key: <span class="gates"><span class="g-pass">✓</span></span> pass <span class="gates"><span class="g-cond">~</span></span> qualified or conditional <span class="gates"><span class="g-fail">✕</span></span> fail <span class="gates"><span class="g-ns">○</span></span> not started <span class="gates"><span class="g-ns">–</span></span> not applicable.</p>
    <div class="panel">
      <div class="toolbar">

        <thead><tr><th scope="col">Project</th><th scope="col">Capacity as disclosed</th><th scope="col">Evidence</th><th scope="col">Stage gates<div class="gates gh" aria-hidden="true">${GATE_IDS.map(g => `<span>${g.slice(1)}</span>`).join('')}</div></th><th scope="col">Evidence checks<div class="gates gh" aria-hidden="true"><span>E1</span><span>E2</span><span>E3</span></div></th><th scope="col">Screening status</th>${sv?'<th scope="col" class="num">Screening NPV / IRR</th><th scope="col">Credit warnings</th>':''}<th scope="col">Key blockers</th></tr></thead>

  $app.innerHTML = `<div class="rec-head"><div class="wrap">
    <div class="crumbs"><a href="#portfolio">Portfolio</a><span aria-hidden="true">/</span><span>${esc(c.sponsor)}</span></div>

    <nav class="tabs" aria-label="Project record sections">${TABS.map(([k, l]) => `<a href="#case.${c.key}.${k}" aria-selected="${k===tab}"${k===tab?' aria-current="page"':''}>${l}${k==='evidence'?`<span class="cnt">${c.factIds.length}</span>`:k==='decisions'?`<span class="cnt">${openN}</span>`:''}</a>`).join('')}</nav>

  const conflict = p && !p.values.includes(a.powerResponsibility);
  const items = [['Gross power cost', s.grossPowerCostM, 'All modeled energy for leased MW'],['Landlord power expense', s.landlordPowerExpenseM, 'Energy cost booked by the owner'],['Reimbursed by tenant', s.powerReimbursementM, 'Pass-through billed back'],['Paid by tenant directly', s.tenantDirectPowerM, 'Never on the owner’s books'],['Net landlord power cost', s.netLandlordPowerCostM, 'Owner expense after reimbursement']];
  const mx = Math.max(1, ...items.map(x => Math.abs(x[1])));

function tabFinance(c, el){
  el.innerHTML = `<div class="split">
    <section class="panel" aria-labelledby="inp"><div class="panel-h"><h2 id="inp">Scenario inputs</h2><button class="btn" id="reset" type="button">Reset to frozen inputs</button></div><div class="panel-b" id="inputs" style="padding-top:4px"></div></section>
    <div id="out"></div></div>`;
  const draw = () => {
    const res = runScenario(c);
    drawInputs(c, res);
    drawOutputs(c, res, document.getElementById('out'));
    refreshHeader(c, res);
    document.getElementById('reset').disabled = !isEdited(c);
  };
  document.getElementById('reset').addEventListener('click', () => { delete state.overrides[c.key]; delete state.notes[c.key]; draw(); document.getElementById('reset').focus(); });
  let t;
  el.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    const def = INPUTS.find(x => x.k === k);
    const v = def.type === 'select' ? e.target.value : e.target.value === '' ? NaN : Number(e.target.value);
    const base = c.assumptions[k] ?? E.defaults()[k];
    state.overrides[c.key] = state.overrides[c.key] || {};
    if (v === base) delete state.overrides[c.key][k]; else state.overrides[c.key][k] = v;
    clearTimeout(t);
    t = setTimeout(() => { const res = runScenario(c); drawOutputs(c, res, document.getElementById('out')); refreshHeader(c, res); updateProv(c, res); document.getElementById('reset').disabled = !isEdited(c); }, 120);
  });
  draw();
}
function drawInputs(c, res){
  const a = res.r ? res.r.assumptions : scenarioInput(c);
  const ov = state.overrides[c.key] || {};
  const la = res.r ? res.r.summary.leaseAudits : [];
  const rentUnused = la.length && la.every(x => x.mode !== 'starting');
  document.getElementById('inputs').innerHTML = INPUTS.map(d => {
    const id = 'in-' + d.k, val = d.k in ov ? ov[d.k] : (a[d.k] ?? E.defaults()[d.k]);
    const refs = (c.refs && c.refs[d.k]) || [];
    const ctrl = d.type === 'select'
      ? `<select id="${id}" data-k="${d.k}">${Object.entries(RESP).map(([k, l]) => `<option value="${k}" ${k===val?'selected':''}>${l}</option>`).join('')}</select>`
      : `<input id="${id}" data-k="${d.k}" type="number" inputmode="decimal" step="${d.step}" min="${d.min}" value="${esc(Number.isFinite(val)?val:'')}" ${d.k==='rentPerKwMonth'&&rentUnused?'disabled aria-describedby="rent-note"':''}>`;
    return `<div class="field"><label for="${id}">${d.label}${d.k in ov?' <span class="edited-dot" title="Edited">•</span>':''}</label>
      <div class="row">${ctrl}</div>${d.unit?`<span class="unit">${d.unit}</span>`:''}
      <div class="hint" data-prov="${d.k}">${inputProvenance(c, d.k, val, d.k in ov)}</div>
      ${d.k==='rentPerKwMonth'&&rentUnused?`<div class="hint" id="rent-note">Not used for this case: each building’s rent is spread from its contracted total (engine rent mode “total”).</div>`:''}
      ${d.k==='powerResponsibility' ? (c.power ? `<div class="hint">${badge(c.power.label)}<span>${esc(c.power.text)} <span class="ref">${esc(c.power.ref)}</span></span></div>` : `<div class="hint">No source covers this lease’s power payer.</div>`) : ''}
      ${refs.map(r => `<div class="hint">${badge(r.label)}<span>${esc(r.text)} <span class="ref">${esc(r.ref)}</span></span></div>`).join('')}
    </div>`;
  }).join('');
}
function updateProv(c, res){
  const ov = state.overrides[c.key] || {};
  INPUTS.forEach(d => { const el = document.querySelector(`[data-prov="${d.k}"]`); if (!el) return;
    const val = d.k in ov ? ov[d.k] : (c.assumptions[d.k] ?? E.defaults()[d.k]);
    el.innerHTML = inputProvenance(c, d.k, val, d.k in ov);
    const lab = document.querySelector(`label[for="in-${d.k}"]`); if (lab) lab.innerHTML = d.label + (d.k in ov ? ' <span class="edited-dot" title="Edited">•</span>' : '');
  });

/* ---------- SVG line chart (one y-axis; plots engine rows as given) ---------- */
function nice(max){ if (max <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(max))), m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function lineChart(host, rows, a, series, opt){
  const W = Math.max(300, Math.round(host.clientWidth || 760)), H = W < 520 ? 190 : 230, L = 46, R = 12, T = 10, B = opt.breach ? 36 : 26;
  if (!host._ro && window.ResizeObserver){ let lw = W; host._ro = new ResizeObserver(() => { const nw = Math.round(host.clientWidth); if (nw && Math.abs(nw - lw) > 4){ lw = nw; lineChart(host, rows, a, series, opt); } }); host._ro.observe(host); }
  const vals = rows.flatMap(r => series.map(s => r[s.k])).concat(opt.ref != null ? [opt.ref] : []).filter(Number.isFinite);
  let vmax = Math.max(0, ...vals); const vmin = Math.min(0, ...vals);
  let cap = Infinity;
  if (opt.clip && vals.length > 20){ const so = vals.slice().sort((p, q) => p - q), p98 = so[Math.floor(so.length * 0.98)]; if (p98 > 0 && vmax > 4 * p98){ cap = p98 * 1.3; vmax = cap; } }
  const step = nice(Math.max(vmax, -vmin, 1e-9) / 4), top = Math.max(step, Math.ceil(vmax / step) * step), bot = vmin < 0 ? -Math.ceil(-vmin / step) * step : 0;
  const n = rows.length, x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - B) * (top - Math.min(v, cap)) / (top - bot || 1);
  let g = '';
  for (let v = bot; v <= top + 1e-9; v += step){ g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${nf0.format(v)}</text>`; }
  const yr0 = a.calendarStartYear; let xt = '';
  for (let i = 0; i < n; i++){ const idx = (a.calendarStartMonth - 1) + i; if (idx % 12 === 0){ const yr = yr0 + idx / 12; if ((yr - yr0) % (W < 520 ? (n > 180 ? 6 : 4) : (n > 180 ? 4 : 2)) === 0) xt += `<line class="ax" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${H-B}" y2="${H-B+4}"/><text x="${x(i).toFixed(1)}" y="${H-B+15}" text-anchor="middle">${yr}</text>`; } }
  const path = k => rows.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[k]).toFixed(1)).join('');
  let area = '';
  if (opt.area){ const k = series[0].k; area = `<path class="ar1" d="${path(k)}L${x(n-1).toFixed(1)} ${y(0).toFixed(1)}L${x(0).toFixed(1)} ${y(0).toFixed(1)}Z"/>`; }
  const ref = opt.ref != null ? `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(opt.ref).toFixed(1)}" y2="${y(opt.ref).toFixed(1)}"/>` : '';
  const bm = (opt.breach || []).map(m => `<rect class="bm" x="${(x(m-1)-1).toFixed(1)}" y="${H-B+20}" width="2" height="8"/>`).join('');
  let off = '';
  if (cap < Infinity) rows.forEach((r, i) => series.forEach(sr => { if (r[sr.k] > cap) off += `<path d="M${(x(i)-5).toFixed(1)} ${(T+7).toFixed(1)}L${x(i).toFixed(1)} ${T-1}L${(x(i)+5).toFixed(1)} ${(T+7).toFixed(1)}Z" fill="var(--s2)"/><text x="${Math.min(W-R-4, x(i)-7).toFixed(1)}" y="${(T+8).toFixed(1)}" text-anchor="end">${sr.n} ${fM(r[sr.k])} off scale</text>`; }));
  const label = `${series.map(s => s.n).join(' and ')} by month, ${n} months`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" tabindex="0">${g}<line class="ax" x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>${xt}${area}${ref}${series.map(s => `<path class="${s.cls}" d="${path(s.k)}"/>`).join('')}${bm}${off}
    <g class="hov" visibility="hidden"><line class="xh" y1="${T}" y2="${H-B}"/>${series.map(s => `<circle class="${s.dot}" r="4"/>`).join('')}</g>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg = host.querySelector('svg'), hov = svg.querySelector('.hov'), tip = host.querySelector('.tip');
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(n - 1, i)); const r = rows[cur];
    hov.setAttribute('visibility', 'visible');
    const xl = hov.querySelector('line'); xl.setAttribute('x1', x(cur)); xl.setAttribute('x2', x(cur));
    hov.querySelectorAll('circle').forEach((c, j) => { c.setAttribute('cx', x(cur)); c.setAttribute('cy', y(r[series[j].k])); });
    tip.hidden = false;
    tip.innerHTML = `<b>M${r.month} · ${cal(r.month, a)}</b>` + series.map(s => `<div><span>${s.n}</span><span>${fM(r[s.k])}</span></div>`).join('') + (Number.isFinite(r.dscr) && opt.breach ? `<div><span>DSCR</span><span>${fX(r.dscr)}</span></div>` : '') + (r.breach && opt.breach ? `<div style="color:var(--bad)"><span>Covenant breach</span><span>yes</span></div>` : '');
    const bw = host.clientWidth, px = x(cur) / W * bw, tw = tip.offsetWidth || 160;
    tip.style.left = Math.max(0, Math.min(bw - tw, px + 12 > bw - tw ? px - tw - 12 : px + 12)) + 'px'; tip.style.top = '4px';
  };
  const hide = () => { hov.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  svg.addEventListener('pointermove', e => { const bx = svg.getBoundingClientRect(); const vx = (e.clientX - bx.left) / bx.width * W; show(Math.round((vx - L) / (W - L - R) * (n - 1))); });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    const st = e.shiftKey ? 12 : 1;
    if (e.key === 'ArrowRight'){ show(cur < 0 ? 0 : cur + st); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ show(cur < 0 ? n - 1 : cur - st); e.preventDefault(); }
    else if (e.key === 'Escape') hide();
  });
}

  const others = (c.templates || []).filter(x => !(on && x.id === 'apld_computeco_2030'));
  const tplHtml = others.length ? `<section class="panel" aria-labelledby="tt"><div class="panel-h"><h2 id="tt">Public notes templates</h2><span class="small muted">transactions_v259.json</span></div><div class="panel-b stack" style="gap:18px">
    ${others.map(x => { const t = TPL[x.id]; return `<div class="stack" style="gap:8px"><div class="lrow"><h3>${esc(t.name)}</h3><span class="chip ${x.modeled ? 'warn' : 'ns'}">${x.modeled ? 'Modelable in scenario above' : 'Not modeled'}</span><span class="ref">${esc(t.id)}</span></div>
      <p class="small" style="color:var(--ink-2)">${esc(x.reason)}</p>${termsTable(t)}</div>`; }).join('')}</div></section>` : '';
  el.innerHTML = `<div class="stack">${toggle}${body}${tplHtml}
    <section class="panel" aria-labelledby="pn"><div class="panel-h"><h2 id="pn">Public note facts on file</h2><span class="small muted">${dfacts.length} facts from VERIFIED_FACTS</span></div><div class="panel-b">${factsHtml}</div></section></div>`;
  if (fac) fac.forEach((f, fi) => {
    const sch = f.schedule || [];
    lineChart(document.getElementById('fc1-' + fi), sch, a, [{k:'closing', n:'Closing balance', cls:'l1', dot:'dot1'}, {k:'dsraBalance', n:'DSRA balance', cls:'l2', dot:'dot2'}], {area:false});
    lineChart(document.getElementById('fc2-' + fi), sch, a, [{k:'interestPaid', n:'Interest paid', cls:'l1', dot:'dot1'}, {k:'principalPaid', n:'Principal paid', cls:'l2', dot:'dot2'}], {area:false, clip:true});
  });
  const tg = document.getElementById('notes-toggle');
  if (tg) tg.addEventListener('change', e => { state.notes[c.key] = e.target.checked; tabDebt(c, el); refreshHeader(c, runScenario(c)); document.getElementById('notes-toggle').focus(); });
}

/* ---------- evidence ---------- */
function factCard(f){ return `<li><div class="lrow">${badgesFor(f.evidence_label)}<span class="ref">${esc(f.fact_id)} · as of ${esc(f.as_of || 'undated')} · reopened in review: ${f.independently_reopened_in_this_review==='Y'?'yes':'no'}</span></div>
  <div><b>${esc(f.metric)}</b> <span class="muted">(${esc(f.source_scope)})</span></div><div>${esc(f.value)} <span class="muted">${esc(f.units)}</span></div>
  ${f.caveat?`<div class="small" style="color:var(--ink-2)">Caveat: ${esc(f.caveat)}</div>`:''}
  <div class="small"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.source_title)}</a>${f.section?` <span class="muted">· ${esc(f.section)}</span>`:''}</div></li>`; }
function issueCard(i){ const st = isOpen(i) ? 'bad' : isException(i) ? 'warn' : 'ok';
  return `<li><div class="lrow"><span class="chip ${st}">${esc(i.status)}</span><span class="chip ns">${esc(i.severity)}</span><span class="ref">${esc(i.id)} · owner: ${esc(i.owner)}</span></div>
  <div>${esc(i.finding)}</div><div class="small" style="color:var(--ink-2)">Impact: ${esc(i.impact)}</div><div class="small">Fix: ${esc(i.fix)}</div>
  ${/^https?:/.test(i.evidence.trim()) ? `<div class="small">${i.evidence.split(/\s;\s|\s+;\s*/).map(u => u.trim()).filter(u => /^https?:/.test(u)).map(u => `<a class="url" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}…</a>`).join(' · ')}</div>` : i.evidence ? `<div class="small muted">Evidence: ${esc(i.evidence)}</div>` : ''}</li>`; }
function tabEvidence(c, el){
  const fs = factsOf(c), is = issuesOf(c).slice().sort((a,b) => (isOpen(b)-isOpen(a)) || (SEV[a.severity]-SEV[b.severity]));
  el.innerHTML = `<div class="stack"><div class="grid2">
    <section class="panel" aria-labelledby="ef"><div class="panel-h"><h2 id="ef">Sourced facts</h2><span class="small muted">${fs.length} from VERIFIED_FACTS</span></div>
      <div class="panel-b"><ul class="list">${fs.length ? fs.map(factCard).join('') : '<li class="muted">No verified facts for this case.</li>'}</ul></div></section>
    <div class="stack">
    <section class="panel" aria-labelledby="er"><div class="panel-h"><h2 id="er">Case register</h2></div><div class="panel-b"><dl class="kv" style="grid-template-columns:minmax(0,140px) minmax(0,1fr)">
      <div><dt>Capacity basis</dt><dd style="white-space:normal;text-align:left;font-weight:500">${esc(c.register.capacity)}</dd></div>
      <div><dt>Power payer</dt><dd style="white-space:normal;text-align:left;font-weight:500">${esc(c.register.payer)}</dd></div>
      <div><dt>Tier</dt><dd style="white-space:normal;text-align:left">${badgesFor(c.register.tier)} <span class="small muted">${esc(c.register.tier)}</span></dd></div>
      <div><dt>Remaining blocker</dt><dd style="white-space:normal;text-align:left;font-weight:500">${esc(c.register.blocker)}</dd></div>
      <div><dt>Frozen input source</dt><dd style="white-space:normal;text-align:left;font-weight:500;word-break:break-all"><a href="${esc(c.source)}" target="_blank" rel="noopener">${esc(c.source)}</a><div class="small muted">${esc(humanTier(c.evidenceTier))}</div></dd></div>
    </dl></div></section>
    <section class="panel" aria-labelledby="ei"><div class="panel-h"><h2 id="ei">Issues and blockers</h2><span class="small muted">${is.filter(isOpen).length} open</span></div>
      <div class="panel-b"><ul class="list">${is.map(issueCard).join('')}</ul></div></section></div>
  </div></div>`;
}

/* ---------- decisions ---------- */
function tabDecisions(c, el){
  const res = runScenario(c), gs = officialGates(res).concat(evidenceChecks(c, res));
  const open = issuesOf(c).filter(isOpen).sort((a,b) => SEV[a.severity]-SEV[b.severity]);
  const exc = issuesOf(c).filter(isException);
  const gateActs = gs.filter(g => g.status !== 'PASS' && g.status !== 'NOT APPLICABLE');
  el.innerHTML = `<div class="stack">
    <section class="panel" aria-labelledby="na"><div class="panel-h"><h2 id="na">Next actions</h2><span class="small muted">From open issues, ordered by severity</span></div>
      <div class="panel-b"><ol class="list">${open.map(i => `<li><div class="lrow"><span class="chip ${i.severity==='Blocker'?'bad':i.severity==='Material'?'warn':'ns'}">${esc(i.severity)}</span><span class="ref">${esc(i.id)} · owner: ${esc(i.owner)}</span></div><div><b>${esc(i.fix)}</b></div><div class="small" style="color:var(--ink-2)">Why: ${esc(i.finding)}</div></li>`).join('')}
      ${c.register.blocker && c.register.blocker !== '—' ? `<li><div class="lrow"><span class="chip ns">Register</span><span class="ref">CASE_ASSUMPTION_REGISTER</span></div><div><b>Resolve: ${esc(c.register.blocker)}</b></div></li>` : ''}</ol></div></section>
    <section class="panel" aria-labelledby="gc"><div class="panel-h"><h2 id="gc">Evidence needed to advance gates and checks</h2></div>
      ${gateActs.map(g => `<div class="gate"><span class="gid">${g.id}</span><div><h3>${esc(g.close)}</h3><p class="why">${esc(g.name)}: ${esc(g.detail)}</p></div>${gateChip(g.status)}</div>`).join('')}</section>
    ${exc.length ? `<section class="panel" aria-labelledby="ex"><div class="panel-h"><h2 id="ex">Accepted model limitations</h2><span class="small muted">Status: Exception</span></div><div class="panel-b"><ul class="list">${exc.map(i => `<li><div class="lrow"><span class="ref">${esc(i.id)}</span></div><div>${esc(i.finding)}</div><div class="small muted">${esc(i.fix)}</div></li>`).join('')}</ul></div></section>` : ''}
  </div>`;
}

/* ---------- evidence library ---------- */
function renderEvidenceLib(){
  const all = Object.values(D.facts);
  const citedBy = id => D.cases.filter(c => c.factIds.includes(id));
  $app.innerHTML = `<main class="wrap" id="main"><div class="pagehead"><div><h1 tabindex="-1">Evidence library</h1><p class="prose">${all.length} dated, sourced facts from VERIFIED_FACTS. Every value in a project record links back to one of these, a register row or an issue.</p></div></div>
  <div class="panel"><div class="toolbar" role="group" aria-label="Filter by evidence label">
    <label for="q" class="sr">Search facts</label><input type="search" id="q" placeholder="Search metric, entity, value">
    <span class="chips">${LABELS.map(l => `<label style="font-weight:500"><input type="checkbox" class="lf" value="${esc(l.name)}" checked> ${badge(l.name)} <span class="small muted">${all.filter(f => labelsIn(f.evidence_label).includes(l.name)).length}</span></label>`).join('')}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Fact</th><th>Label</th><th>Metric and value</th><th>As of</th><th>Source</th><th>Cases</th></tr></thead><tbody id="fbody"></tbody></table></div></div></main>`;
  const draw = () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const on = [...document.querySelectorAll('.lf:checked')].map(x => x.value);
    const rows = all.filter(f => labelsIn(f.evidence_label).some(l => on.includes(l)) && (!q || Object.values(f).join(' ').toLowerCase().includes(q)));
    document.getElementById('fbody').innerHTML = rows.map(f => `<tr><td>${esc(f.fact_id)}<div class="small muted">${esc(f.entity)}</div></td><td>${badgesFor(f.evidence_label)}</td><td style="min-width:260px"><b>${esc(f.metric)}</b><div>${esc(f.value)} <span class="muted">${esc(f.units)}</span></div>${f.caveat?`<div class="small muted">${esc(f.caveat)}</div>`:''}</td><td class="num">${esc(f.as_of||'—')}</td><td style="min-width:200px"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.source_title)}</a></td><td style="min-width:140px">${citedBy(f.fact_id).map(c => `<a href="#case.${c.key}.evidence">${esc(c.name)}</a>`).join(', ') || '<span class="muted">—</span>'}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">No facts match. Clear the search or turn a label back on.</td></tr>`;
  };
  document.getElementById('q').addEventListener('input', draw);
  document.querySelectorAll('.lf').forEach(x => x.addEventListener('change', draw));
  draw();
}

/* ---------- method ---------- */
function renderMethod(){
  $app.innerHTML = `<main class="wrap" id="main"><div class="pagehead"><div><h1 tabindex="-1">Method and limits</h1><p class="prose">How this screen turns engine outputs and evidence registers into a project record, and what it does not do.</p></div></div>
  <div class="stack prose" style="max-width:none">
  <section class="panel"><div class="panel-h"><h2>Evidence labels</h2></div><div class="panel-b"><ul class="list">
    <li><div class="lrow">${badge('Executed')}</div><div>Stated in an executed agreement, indenture or company filing.</div></li>
    <li><div class="lrow">${badge('Public approximate')}</div><div>Publicly disclosed but approximate, aggregated or secondary.</div></li>
    <li><div class="lrow">${badge('Management expectation')}</div><div>A company forecast or target.</div></li>
    <li><div class="lrow">${badge('Assumption')}</div><div>A model input with no source. Every editable input carries this label unless the evidence supports its value.</div></li>
    <li><div class="lrow">${badge('Unknown')}</div><div>Not disclosed in the sources read.</div></li></ul>
    <p class="small muted">Each label has its own glyph and border style, so it reads without colour.</p></div></section>
  <section class="panel"><div class="panel-h"><h2>Stage gates G0–G5 (Risk policy)</h2></div><div class="panel-b"><p class="small" style="margin-bottom:8px">Every gate status, permitted use and valuation label comes from <code>PowerPathEngine.assurance.assess(result, {}, ENGINE_VERSION)</code>. The UI adds no gate logic. No executed documents exist for any public case, so evidence is empty and transaction valuation and lender certification are BLOCKED for all 16.</p><ul class="list">
    ${GATE_IDS.map(id => `<li><b>${id} ${esc(GATE_NAMES[id])}</b><span>${esc(GATE_CLOSE[id])}</span></li>`).join('')}</ul></div></section>
  <section class="panel"><div class="panel-h"><h2>Evidence checks E1–E3</h2></div><div class="panel-b"><p class="small" style="margin-bottom:8px">Register comparisons that point at missing evidence. They are not stage gates and unlock nothing.</p><ul class="list">
    <li><b>E1 Capacity basis</b><span>FAIL when the register discloses gross or leased power (the engine models IT MW). PASS only when every capacity fact for the case is Executed; otherwise CONDITIONAL.</span></li>
    <li><b>E2 Power payer</b><span>FAIL when no source covers the payer or the scenario contradicts the evidence; otherwise CONDITIONAL, because billing and timing still need the lease.</span></li>
    <li><b>E3 Lease revenue</b><span>From the engine’s lease audit: FAIL when any building lacks a contracted value or does not reconcile; CONDITIONAL when arithmetic reconciles.</span></li></ul></div></section>
  <section class="panel"><div class="panel-h"><h2>What this screen guarantees</h2></div><div class="panel-b"><ul class="list">
    <li>All financial numbers come from <code>PowerPathEngine.evaluate()</code>, embedded unmodified (engine ${esc(E.ENGINE_VERSION)}, file hash ${esc(D.sources['engine-v259/dist/powerpath-engine.js'])}). The page formats outputs; it computes none.</li>
    <li>Values appear only inside a screening panel with the engine’s status, the full credit warning list and the label “Screening scenario — not a valuation” from <code>assess().display.valuationLabel</code>.</li>
    <li>The portfolio is never ordered by value, and values are hidden until you ask for them.</li>
    <li>Facts, labels and blockers come from VERIFIED_FACTS, CASE_ASSUMPTION_REGISTER and ISSUES. Frozen inputs hash ${esc(D.sources['frozen_inputs_16.json'])}.</li>
    <li>Scenario edits stay in this browser tab and are marked “Edited scenario”.</li></ul></div></section>
  <section class="panel"><div class="panel-h"><h2>Known limits</h2></div><div class="panel-b"><ul class="list">
    <li>Debt is a generic construction loan with refinance. Public notes are modeled only in the Polaris Forge 1 scenario, with a synthetic building mapping; elsewhere notes are shown as template terms (CA-16).</li>
    <li>Power cost is leased IT MW × PUE × hours × flat price; no demand, transmission or vacancy charges (V6, V7).</li>
    <li>APLD capex uses a synthetic $7M per MW against guidance of $11–13M (V3).</li>
    <li>The engine’s catalog source tree was not supplied for review (V12).</li></ul></div></section>
  </div></main>`;
}

/* ---------- theme + footer ---------- */
const tbtn = document.getElementById('theme-toggle');
const modes = ['system','light','dark'];
let mode = 'system'; try { mode = localStorage.getItem('pp-theme') || 'system'; } catch(e) {}
function applyTheme(){ if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode); tbtn.textContent = 'Theme: ' + mode; }
tbtn.addEventListener('click', () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; try { localStorage.setItem('pp-theme', mode); } catch(e) {} applyTheme(); });
applyTheme();
document.getElementById('foot').innerHTML = `<strong>PowerPath</strong><span>Engine ${esc(E.ENGINE_VERSION)}</span><span>Screening tool — no lender review or reliance</span><span>Frozen inputs: ${D.cases.length} public cases</span>`;
route();
})();
</script>
</body>
</html>
