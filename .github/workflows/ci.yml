name: source-and-regression
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: python -m pip install -r requirements.txt -r requirements-feasibility.txt -r requirements-postgres-runtime.txt
      - run: python -m scripts.prepare_local
      - run: npm run check
      - run: python -m pytest -q tests/test_cofounder_handoff.py tests/test_managed_identity.py tests/test_runtime_policies.py tests/test_postgres_runtime_candidate.py
      - run: python -m scripts.run_v3081_gate --extended
        env:
          POWERPATH_V27_AUTH_MODE: local_only
