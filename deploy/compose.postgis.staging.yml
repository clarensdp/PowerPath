# OPTIONAL local-only PostgreSQL/PostGIS staging service; NOT a production deployment.
# Docker and postgis image availability must be verified on the operator's machine.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POWERPATH_PG_USER:?Set POWERPATH_PG_USER in your shell}
      POSTGRES_PASSWORD: ${POWERPATH_PG_PASSWORD:?Set POWERPATH_PG_PASSWORD in your shell}
      POSTGRES_DB: powerpath_stage
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_stage_v3081:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "no"
volumes:
  pg_stage_v3081:
