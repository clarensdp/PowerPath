<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to PowerPath</title>
<link rel="stylesheet" href="/excel/taskpane.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="/excel/login.js"></script>
</head>
<body>
<header><strong>↗ PowerPath</strong><small>Sign in for Excel</small></header>
<main>
  <form id="login">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p id="status" role="status"></p>
  <p class="muted foot">Your password goes only to PowerPath. Excel receives a session that ends when Excel closes or the session expires.</p>
</main>
</body>
</html>
